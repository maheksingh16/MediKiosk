spring.application.name=MediKiosk

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/medikiosk
spring.datasource.username=postgres
spring.datasource.password=Mahek@16

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=8080
# OCR configuration
app.ocr.tesseract-path=C:/Program Files/Tesseract-OCR/tesseract.exe
app.ocr.tessdata-path=C:/Program Files/Tesseract-OCR/tessdata
app.ocr.language=eng
app.documents.storage-dir=uploads/medical-documents